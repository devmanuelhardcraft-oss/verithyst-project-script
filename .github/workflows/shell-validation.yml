name: Shell validation

on:
  push:
    branches: [main, "fix/**"]
  pull_request:

jobs:
  bash:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate Bash syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            bash -n "$file"
          done < <(find . -type f -name '*.sh' -not -path './.git/*' -print0)
      - name: Check shared paths from another working directory
        shell: bash
        run: |
          set -euo pipefail
          project_root="$GITHUB_WORKSPACE"
          cd /tmp
          source "$project_root/environment.sh"
          test "$VERTHYST_ROOT" = "$project_root"
          test -d "$VERTHYST_HOME"
          test -d "$VERTHYST_SCRIPTS_DIR"
          test -d "$VERTHYST_GUI_DIR"
